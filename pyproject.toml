[project]
name = "amr-lks-dashboard"
version = "0.1.0"
description = "AMR LKS operator dashboard prototype (Phase 1, simulated data only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
